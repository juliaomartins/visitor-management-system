            type: string
          readOnly: true
          description: The findings in sentences, in the order they should be read.
      required:
      - arrived
      - attendance_rate
      - doors
      - first_arrival
      - last_arrival
      - median_arrival
      - narrative
      - not_arrived
      - not_arrived_count
      - peak_hour
      - peak_share
      - peak_total
      - quiet_hours
      - refusal_rate
      - refused
      - registered
      - repeat_people
      - repeat_share
      - span_minutes
      - vip_arrived
      - vip_share
    ResultCounts:
      type: object
      description: Always all four keys, zero-filled — see counts_by_result().
