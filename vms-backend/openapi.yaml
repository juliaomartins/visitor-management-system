    PatchedVisitorRequest:
      type: object
      description: |-
        `token_hash` is deliberately absent — it never leaves the database.

        `is_active` is read-only: it is switched through `POST /visitors/{id}/activate`
        and `/deactivate` so each change lands in the audit log as a named action
        rather than as an anonymous field edit buried in a PATCH of four other
        fields. Neither one touches the badge token, so the printed card keeps
        working across the whole cycle.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
    RefreshTokenRequest:
      type: object
      description: |-
        Body for refresh/blacklist.

        Normally empty — the refresh token arrives in the `vms_refresh` cookie. The
        explicit field exists for non-browser clients (curl during a rehearsal).
      properties:
        refresh:
          type: string
    ReissueResponse:
      type: object
