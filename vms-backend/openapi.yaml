      - device_name
      - id
      - result
      - scanned_at
      - updated_at
    ScanRequestRequest:
      type: object
      description: What the guard's phone posts for each badge it sees.
      properties:
        token:
          type: string
          minLength: 1
          description: The raw token read out of the QR code.
          maxLength: 128
        scanned_at:
          type: string
          format: date-time
          description: When the badge was presented. Sent by the device, because the
            offline queue may sync minutes later. Defaults to now.
        client_uuid:
          type: string
          format: uuid
          nullable: true
          description: Identifier the device generated for this scan. Posting it twice
