          readOnly: true
        visitor:
          type: string
          format: uuid
          nullable: true
        device:
          type: string
          format: uuid
        device_name:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ResultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
