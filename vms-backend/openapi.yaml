          maxLength: 8
        name:
          type: string
          description: Optional label, e.g. 'North door'. Defaults to 'Scanner 2'.
          maxLength: 100
      required:
      - code
    DevicePaired:
      type: object
      description: |-
        The pairing response — the one and only sight of the raw device token.

        The scanner writes `token` to expo-secure-store; the screen keeps it in its
        local config. It cannot be recovered afterwards, only reissued by pairing again.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        token:
          type: string
          readOnly: true
          description: 'Permanent device token. Sent as `Authorization: Device <token>`.'
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - token
      - updated_at
    DoorLoad:
