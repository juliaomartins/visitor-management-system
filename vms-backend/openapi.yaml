openapi: 3.0.3
info:
  title: VMS API
  version: 0.1.0
  description: Visitor Management System — event badge scanning on a closed LAN.
paths:
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: '`POST /api/v1/auth/token` — admin login.'
      summary: Admin login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/token/blacklist:
    post:
      operationId: auth_token_blacklist_create
      description: |-
        `POST /api/v1/auth/token/blacklist` — logout.

        Blacklisting an already-dead token still clears the cookie: a logout must not
        leave the browser holding something that looks like a session.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '205':
          description: No response body
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        `POST /api/v1/auth/token/refresh` — rotate on the cookie.

        `ROTATE_REFRESH_TOKENS` + `BLACKLIST_AFTER_ROTATION` mean every call issues a
        new refresh token and kills the old one, so the cookie is rewritten here.
      summary: Refresh the access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/badges/card:
    post:
      operationId: badges_card_create
      description: |-
        Takes the raw badge token returned once by `POST /visitors` and returns a CR80 card as a PDF. The token draws the QR and is then discarded; it is never stored, and the visitor is resolved from its digest.

        There is no GET equivalent. Only the digest is kept, so the server cannot reprint a card without being handed the token again.
      summary: Render a single badge PDF
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeCardRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: A CR80 badge PDF.
        '404':
          description: No visitor holds that token.
  /api/v1/badges/export:
    post:
      operationId: badges_export_create
      description: |-
        DESTRUCTIVE. Every visitor in the file is given a NEW badge token, which invalidates the QR on any card already printed for them.

        This is not a choice the endpoint makes: the raw token is stored nowhere, so a scannable QR can be minted but never recovered.

        The workbook carries the QR as an image and the exact payload as text, so a card producer can re-render it at their own size. A second sheet spells out what the file is, because a spreadsheet outlives the click that made it.

        Omit `visitor_ids` to take every visitor who has not been deleted.
      summary: Reissue badges and export them as .xlsx with QR codes
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeExportRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: An .xlsx workbook with one QR per visitor.
  /api/v1/badges/reissue:
    post:
      operationId: badges_reissue_create
      description: |-
        DESTRUCTIVE. Every listed visitor is given a NEW badge token, which invalidates the QR on any card already printed for them.

        Returns the raw tokens so a client can render the QR itself — on screen, or into its own layout. The server cannot return the token of an existing card, only of one it has just minted.

        This response is the ONLY copy. Nothing stores it.
      summary: Reissue badges and return their raw tokens
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReissueResponse'
          description: ''
  /api/v1/badges/reissue-sheet:
    post:
      operationId: badges_reissue_sheet_create
      description: |-
        DESTRUCTIVE. Every listed visitor is given a NEW badge token, which invalidates the QR on any card already printed for them, including one they are currently wearing.

        This is not a choice the endpoint makes: the raw token exists only at the moment it is created, so reprinting is impossible and reissuing is the only thing the server can do.

        Nine cards per A4 sheet with cut marks; more than nine paginates. A run of exactly one comes back as a single 54x85.6mm card page instead, since one card on A4 wastes the sheet.
      summary: Reissue badges and render a printable PDF
      tags:
      - badges
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BadgeReissueSheetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: An A4 sheet of badges as a PDF, or a single CR80 card page
            when exactly one visitor was requested.
  /api/v1/badges/roster.xlsx:
    get:
      operationId: badges_roster_export_retrieve
      description: |-
        Who is registered, as a spreadsheet: serial, name, country, organisation, category, badge state and registration time.

        NON-DESTRUCTIVE. Nothing is reissued and no card stops working.

        There is no QR column. The server stores only `sha256(token)`, so it cannot reproduce the code on a card it has already printed — see POST /badges/export for a file that has one.
      summary: Export the visitor roster as .xlsx
      tags:
      - badges
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: An .xlsx workbook.
  /api/v1/devices:
    get:
      operationId: devices_list
      summary: List paired devices
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/revoke:
    post:
      operationId: devices_revoke_create
      description: The device's scan history stays; its token stops working.
      summary: Revoke a device
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/pair:
    post:
      operationId: devices_pair_create
      description: Returns the permanent device token. It is stored only as a SHA-256
        digest, so this response is the single chance to capture it.
      summary: Redeem a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePaired'
          description: ''
  /api/v1/devices/pairing-code:
    post:
      operationId: devices_pairing_code_create
      description: Short-lived, single-use. Read it off the dashboard and type it
        into the device standing next to you.
      summary: Generate a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
          description: ''
  /api/v1/health:
    get:
      operationId: health_retrieve
      description: Public. Used by the scanner and the lobby screen to find the server
        when its address has changed. Returns the LAN address the server believes
        it has, which is what devices should be pointed at.
      summary: Liveness and identity probe
      tags:
      - health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/reports/entries:
    get:
      operationId: reports_entries_retrieve
      description: |-
        Every badge presented in the range — `valid`, `duplicate`, `revoked` and `invalid` alike. This is the security audit as well as the attendance record, so refusals are in the default view rather than behind a filter.

        Hours are bucketed in the event's timezone, which the response names in `timezone`. Unfiltered and unpaginated: a day of a 250-visitor event is a few thousand rows on a LAN.
      summary: Entrance log with totals
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryReport'
          description: ''
  /api/v1/reports/entries.csv:
    get:
      operationId: reports_entries_csv_retrieve
      description: The same filters as `/reports/entries`. Timestamps are in the event's
        timezone with the offset attached; visitor columns are blank for an `invalid`
        scan, which matched no badge.
      summary: Export the entrance log as CSV
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: text/csv
  /api/v1/reports/entries.pdf:
    get:
      operationId: reports_entries_pdf_retrieve
      description: 'The same filters as `/reports/entries`, as a designed document:
        the headline figures, the findings in sentences, the shape of the day, then
        the tables. Built with ReportLab, so it renders identically wherever the server
        runs.'
      summary: Export the entrance report as PDF
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: application/pdf
  /api/v1/reports/entries.xlsx:
    get:
      operationId: reports_entries_xlsx_retrieve
      description: |-
        The same filters as `/reports/entries`, as a workbook: a summary with the written findings, hourly flow with a chart, delegations, load by door, the registered visitors who never arrived, and the full log.

        Figures are written as numbers, not text, so they can be pivoted without cleaning the file first.
      summary: Export the entrance report as .xlsx
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Visitor category. Also excludes `invalid` scans.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country, case-insensitive. Excludes `invalid` scans, which
          match no visitor and so have no country.
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day to include, inclusive. Defaults to today.
      - in: query
        name: result
        schema:
          type: string
          enum:
          - duplicate
          - invalid
          - revoked
          - valid
        description: Scan outcome. Omit to see every badge presented.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day to include, inclusive. Defaults to today.
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: xlsx
  /api/v1/scans:
    post:
      operationId: scans_create
      description: 'Always 200 — read `result`, not the status code. A revoked or
        forged badge is a business outcome (`revoked` / `invalid`), which keeps the
        scanner app''s error handling to genuine network failures. A visitor re-presented
        within the dedupe window returns `duplicate`: still logged, but kept off the
        lobby screen.'
      summary: Record a badge scan
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
        required: true
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
          description: ''
  /api/v1/screen/feed:
    get:
      operationId: screen_feed_retrieve
      description: Everything the screen missed while it was not listening.
      summary: Backfill arrivals after a reconnect
      parameters:
      - in: query
        name: since
        schema:
          type: integer
        description: Last `id` the screen has already rendered. Omit or pass 0 on
          a cold start.
      tags:
      - screen
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenFeed'
          description: ''
  /api/v1/visitors:
    get:
      operationId: visitors_list
      summary: List visitors
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Filter by badge category.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country match, case-insensitive.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by badge state. `false` lists deactivated visitors.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: with_tokens
        schema:
          type: boolean
        description: Include `badge_token` on every row. Off by default. Each token
          is a working credential, so this turns one request into a set of usable
          badges -- ask for it only where the codes are the point, such as a print
          queue that draws the real QR. The same codes are already in the .xlsx export.
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visitor'
          description: ''
    post:
      operationId: visitors_create
      description: Returns `badge_token`, the raw value for the QR code. It is stored
        only as a SHA-256 digest, so this response is the single chance to capture
        it — generate the badge PDF from it immediately.
      summary: Register a visitor and issue a badge
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorIssued'
          description: ''
  /api/v1/visitors/{id}:
    get:
      operationId: visitors_retrieve
      summary: Visitor detail, with scan history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorDetail'
          description: ''
    patch:
      operationId: visitors_partial_update
      summary: Edit a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
    delete:
      operationId: visitors_destroy
      summary: Soft-delete a visitor (also deactivates the badge)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/visitors/{id}/activate:
    post:
      operationId: visitors_activate_create
      description: Undo a deactivation. The badge already in the visitor's hand starts
        scanning again — nothing is reissued, because the token never moved.
      summary: Activate a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
  /api/v1/visitors/{id}/deactivate:
    post:
      operationId: visitors_deactivate_create
      description: The visitor stays on the list and keeps their scan history; their
        badge stops scanning and shows `revoked` at the door. **The QR is not changed**
        — `activate` puts the same printed card back to work, so a lost badge that
        turns up again needs no reprint.
      summary: Deactivate a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
  /api/v1/visitors/{id}/permanent:
    delete:
      operationId: visitors_permanent_destroy
      description: Irreversible. Drops the registration row and the visitor's photo
        from storage. Scans of this badge are kept and anonymised rather than deleted
        -- `ScanEvent.visitor` is set to null, so the entrance log still shows that
        something was presented at that door at that minute, and the response reports
        how many rows that affected. `DELETE /visitors/{id}` is the ordinary removal
        and is reversible by hand; this is not.
      summary: Delete a visitor permanently
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorPurged'
          description: ''
components:
  schemas:
    AbsentVisitor:
      type: object
      description: Registered, with no valid scan in the period.
      properties:
        badge_serial:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        organization:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
      required:
      - badge_serial
      - category
      - country
      - full_name
      - organization
    AccessToken:
      type: object
      description: |-
        The auth response body.

        Only the access token is returned. The refresh token goes out as an httpOnly
        cookie so no JavaScript on the dashboard can read it.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AdminTokenObtainPairRequest:
      type: object
      description: |-
        Username + password → JWT pair, for administrators only.

        A non-staff account would receive a token that `IsAdmin` rejects on every
        endpoint, which reads as a broken dashboard. Failing at login instead says
        what actually happened.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    BadgeCardRequestRequest:
      type: object
      description: |-
        What the registration receipt posts back to get a printable card.

        The raw token, and only the raw token. The server resolves the visitor from
        its SHA-256 digest exactly as `/scans` does, so this is not an oracle: a
        caller who does not already hold the token gets nothing, and one who does is
        holding the badge anyway.
      properties:
        token:
          type: string
          minLength: 1
          description: The raw badge token, as returned once by POST /visitors. Not
            stored; used to draw the QR and then discarded.
          maxLength: 128
      required:
      - token
    BadgeExportRequestRequest:
      type: object
      description: |-
        Which visitors go into the credential spreadsheet.

        Every one of them gets a NEW token, for the same reason the sheet does: the
        server keeps only a digest, so a scannable QR can be minted but never
        recovered. Omit the list to take everyone who is still registered.
      properties:
        visitor_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Visitors to reissue and export, in row order. Omit to export
            every visitor who has not been deleted.
          maxItems: 250
    BadgeReissueSheetRequestRequest:
      type: object
      description: |-
        Which visitors to put on the sheet.

        Every one of them gets a NEW token — see the endpoint description. There is no
        way to reprint an existing card, because the raw token it carries was never
        stored.
      properties:
        visitor_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Visitors to reissue and print, in the order they appear on
            the sheet.
          maxItems: 250
      required:
      - visitor_ids
    CategoryCount:
      type: object
      properties:
        category:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
      required:
      - category
      - total
    CategoryEnum:
      enum:
      - normal
      - vip
      type: string
      description: |-
        * `normal` - Normal
        * `vip` - VIP
    CountryCount:
      type: object
      properties:
        country:
          type: string
          readOnly: true
        total:
          type: integer
          readOnly: true
      required:
      - country
      - total
    Device:
      type: object
      description: '`token_hash` is deliberately absent — the raw token is shown once,
        at pairing.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
