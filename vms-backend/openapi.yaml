    VisitorIssuedRequest:
      type: object
      description: |-
        The response to `POST /visitors` — the one and only sight of the raw token.

        `badge_token` is what goes into the QR. It is not stored anywhere and cannot
        be recovered: the caller must print the card now (CLAUDE.md constraint #3).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
      required:
      - country
      - full_name
      - photo
    VisitorPurged:
      type: object
      description: |-
        What a permanent delete reports back.

        Not a ModelSerializer: by the time this is rendered the row is gone. It
        exists so the shape is in the schema and the dashboard can read
        `scans_orphaned` from a generated type rather than a hand-written one.
      properties:
        badge_serial:
          type: string
          description: The serial of the registration that was removed.
        scans_orphaned:
          type: integer
          description: Scan events kept but detached from the visitor. They still
            count towards the entrance log; they no longer say who presented the badge.
      required:
      - badge_serial
      - scans_orphaned
  securitySchemes:
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Permanent token from `POST /api/v1/devices/pair`, sent as `Authorization:
        Device <token>`.'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
