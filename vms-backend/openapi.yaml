    ReissuedBadge:
      type: object
      description: |-
        One reissued badge, including the RAW token.

        This is the same disclosure `POST /visitors` already makes, and for the same
        reason: the raw value exists for one moment and the caller gets the only copy.
        Admin-only, and the response is never cached.
      properties:
        visitor_id:
          type: string
          format: uuid
          readOnly: true
        badge_serial:
          type: string
          readOnly: true
        full_name:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        token:
          type: string
          readOnly: true
          description: The raw badge token, exactly as the QR must encode it. Not
            stored; this response is the only copy.
      required:
      - badge_serial
      - category
      - full_name
      - token
      - visitor_id
    ReportInsights:
