          readOnly: true
        attendance_rate:
          type: number
          format: double
          readOnly: true
        refused:
          type: integer
          readOnly: true
        refusal_rate:
          type: number
          format: double
          readOnly: true
        quiet_hours:
          type: integer
          readOnly: true
        not_arrived_count:
          type: integer
          readOnly: true
        first_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        median_arrival:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        span_minutes:
          type: integer
          readOnly: true
        peak_hour:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        peak_total:
          type: integer
          readOnly: true
        peak_share:
          type: number
          format: double
          readOnly: true
        vip_arrived:
          type: integer
          readOnly: true
        vip_share:
          type: number
          format: double
          readOnly: true
        repeat_people:
          type: integer
          readOnly: true
        repeat_share:
