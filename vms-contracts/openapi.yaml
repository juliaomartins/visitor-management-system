openapi: 3.0.3
info:
  title: VMS API
  version: 0.1.0
  description: Visitor Management System — event badge scanning on a closed LAN.
paths:
  /api/v1/auth/token:
    post:
      operationId: auth_token_create
      description: '`POST /api/v1/auth/token` — admin login.'
      summary: Admin login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminTokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/auth/token/blacklist:
    post:
      operationId: auth_token_blacklist_create
      description: |-
        `POST /api/v1/auth/token/blacklist` — logout.

        Blacklisting an already-dead token still clears the cookie: a logout must not
        leave the browser holding something that looks like a session.
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '205':
          description: No response body
  /api/v1/auth/token/refresh:
    post:
      operationId: auth_token_refresh_create
      description: |-
        `POST /api/v1/auth/token/refresh` — rotate on the cookie.

        `ROTATE_REFRESH_TOKENS` + `BLACKLIST_AFTER_ROTATION` mean every call issues a
        new refresh token and kills the old one, so the cookie is rewritten here.
      summary: Refresh the access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
          description: ''
  /api/v1/devices:
    get:
      operationId: devices_list
      summary: List paired devices
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/{id}/revoke:
    post:
      operationId: devices_revoke_create
      description: The device's scan history stays; its token stops working.
      summary: Revoke a device
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this device.
        required: true
      tags:
      - devices
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
  /api/v1/devices/pair:
    post:
      operationId: devices_pair_create
      description: Returns the permanent device token. It is stored only as a SHA-256
        digest, so this response is the single chance to capture it.
      summary: Redeem a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DevicePairRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePaired'
          description: ''
  /api/v1/devices/pairing-code:
    post:
      operationId: devices_pairing_code_create
      description: Short-lived, single-use. Read it off the dashboard and type it
        into the device standing next to you.
      summary: Generate a pairing code
      tags:
      - devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PairingCodeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
          description: ''
  /api/v1/scans:
    post:
      operationId: scans_create
      description: 'Always 200 — read `result`, not the status code. A revoked or
        forged badge is a business outcome (`revoked` / `invalid`), which keeps the
        scanner app''s error handling to genuine network failures. A visitor re-presented
        within the dedupe window returns `duplicate`: still logged, but kept off the
        lobby screen.'
      summary: Record a badge scan
      tags:
      - scans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanRequestRequest'
        required: true
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanResponse'
          description: ''
  /api/v1/screen/feed:
    get:
      operationId: screen_feed_retrieve
      description: Everything the screen missed while it was not listening.
      summary: Backfill arrivals after a reconnect
      parameters:
      - in: query
        name: since
        schema:
          type: integer
        description: Last `id` the screen has already rendered. Omit or pass 0 on
          a cold start.
      tags:
      - screen
      security:
      - deviceAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenFeed'
          description: ''
  /api/v1/visitors:
    get:
      operationId: visitors_list
      summary: List visitors
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - normal
          - vip
        description: Filter by badge category.
      - in: query
        name: country
        schema:
          type: string
        description: Exact country match, case-insensitive.
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filter by badge state. `false` lists revoked badges.
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visitor'
          description: ''
    post:
      operationId: visitors_create
      description: Returns `badge_token`, the raw value for the QR code. It is stored
        only as a SHA-256 digest, so this response is the single chance to capture
        it — generate the badge PDF from it immediately.
      summary: Register a visitor and issue a badge
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/VisitorIssuedRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorIssued'
          description: ''
  /api/v1/visitors/{id}:
    get:
      operationId: visitors_retrieve
      summary: Visitor detail, with scan history
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorDetail'
          description: ''
    patch:
      operationId: visitors_partial_update
      summary: Edit a visitor
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedVisitorRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
    delete:
      operationId: visitors_destroy
      summary: Soft-delete a visitor (also revokes the badge)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/visitors/{id}/revoke:
    post:
      operationId: visitors_revoke_create
      description: The visitor stays on the list and keeps their scan history; the
        badge stops working. Reprinting means issuing a new token.
      summary: Revoke a lost badge
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this visitor.
        required: true
      tags:
      - visitors
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visitor'
          description: ''
components:
  schemas:
    AccessToken:
      type: object
      description: |-
        The auth response body.

        Only the access token is returned. The refresh token goes out as an httpOnly
        cookie so no JavaScript on the dashboard can read it.
      properties:
        access:
          type: string
          readOnly: true
      required:
      - access
    AdminTokenObtainPairRequest:
      type: object
      description: |-
        Username + password → JWT pair, for administrators only.

        A non-staff account would receive a token that `IsAdmin` rejects on every
        endpoint, which reads as a broken dashboard. Failing at login instead says
        what actually happened.
      properties:
        username:
          type: string
          writeOnly: true
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    CategoryEnum:
      enum:
      - normal
      - vip
      type: string
      description: |-
        * `normal` - Normal
        * `vip` - VIP
    Device:
      type: object
      description: '`token_hash` is deliberately absent — the raw token is shown once,
        at pairing.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - updated_at
    DevicePairRequestRequest:
      type: object
      description: What a device posts to `/devices/pair` — the only endpoint with
        no token.
      properties:
        code:
          type: string
          minLength: 1
          description: The 6-character code shown on the dashboard.
          maxLength: 8
        name:
          type: string
          description: Optional label, e.g. 'North door'. Defaults to 'Scanner 2'.
          maxLength: 100
      required:
      - code
    DevicePaired:
      type: object
      description: |-
        The pairing response — the one and only sight of the raw device token.

        The scanner writes `token` to expo-secure-store; the screen keeps it in its
        local config. It cannot be recovered afterwards, only reissued by pairing again.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        token:
          type: string
          readOnly: true
          description: 'Permanent device token. Sent as `Authorization: Device <token>`.'
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - token
      - updated_at
    KindEnum:
      enum:
      - scanner
      - screen
      type: string
      description: |-
        * `scanner` - Scanner
        * `screen` - Screen
    PairingCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        expires_at:
          type: string
          format: date-time
          readOnly: true
        used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - expires_at
      - id
      - kind
      - updated_at
      - used_at
    PairingCodeRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/KindEnum'
      required:
      - kind
    PatchedVisitorRequest:
      type: object
      description: |-
        `token_hash` is deliberately absent — it never leaves the database.

        `is_active` is read-only: a badge is killed through `POST /visitors/{id}/revoke`
        so the action lands in the audit log as a revocation, not as a field edit.
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
    RefreshTokenRequest:
      type: object
      description: |-
        Body for refresh/blacklist.

        Normally empty — the refresh token arrives in the `vms_refresh` cookie. The
        explicit field exists for non-browser clients (curl during a rehearsal).
      properties:
        refresh:
          type: string
    ResultEnum:
      enum:
      - valid
      - invalid
      - revoked
      - duplicate
      type: string
      description: |-
        * `valid` - Valid
        * `invalid` - Invalid
        * `revoked` - Revoked
        * `duplicate` - Duplicate
    ScanEvent:
      type: object
      description: The audit view of a scan — every row, including the failures.
      properties:
        id:
          type: integer
          readOnly: true
        visitor:
          type: string
          format: uuid
          nullable: true
        device:
          type: string
          format: uuid
        device_name:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ResultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device
      - device_name
      - id
      - result
      - scanned_at
      - updated_at
    ScanRequestRequest:
      type: object
      description: What the guard's phone posts for each badge it sees.
      properties:
        token:
          type: string
          minLength: 1
          description: The raw token read out of the QR code.
          maxLength: 128
        scanned_at:
          type: string
          format: date-time
          description: When the badge was presented. Sent by the device, because the
            offline queue may sync minutes later. Defaults to now.
      required:
      - token
    ScanResponse:
      type: object
      description: |-
        The answer to `POST /scans` — always 200, with the verdict in `result`.

        `visitor` is null for an `invalid` scan; a forged badge resolves to nobody.
      properties:
        event_id:
          type: integer
          readOnly: true
        result:
          $ref: '#/components/schemas/ResultEnum'
        scanned_at:
          type: string
          format: date-time
        visitor:
          allOf:
          - $ref: '#/components/schemas/ScanVisitor'
          readOnly: true
      required:
      - event_id
      - result
      - scanned_at
      - visitor
    ScanVisitor:
      type: object
      description: 'The little the guard''s phone needs: enough to match a face to
        a name.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          maxLength: 20
      required:
      - badge_serial
      - country
      - full_name
      - id
    ScreenEvent:
      type: object
      description: |-
        What the lobby screen renders, and nothing more.

        Sent over the WebSocket and returned by the backfill endpoint, so both paths
        produce identical objects and the screen can dedupe on `id`.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        photo_url:
          type: string
          format: uri
          description: |-
            Always absolute, always built from MEDIA_BASE_URL.

            Never from `self.context["request"]`: `services.py` serializes this for the
            WebSocket push with no request in scope, so a request-derived URL would
            make the two delivery paths disagree for the same event.
          readOnly: true
        category:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
      required:
      - category
      - country
      - full_name
      - id
      - photo_url
      - scanned_at
    ScreenFeed:
      type: object
      description: |-
        `GET /screen/feed?since=` — the reconnect backfill.

        `last_id` is the cursor to send next. It advances even when the page was
        truncated, so a screen that has been down for an hour catches up over
        several polls instead of one huge response.
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ScreenEvent'
          readOnly: true
        last_id:
          type: integer
          readOnly: true
      required:
      - events
      - last_id
    User:
      type: object
      description: Admin account, as the dashboard sees it. Never exposes the password
        hash.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - id
      - last_login
      - username
    Visitor:
      type: object
      description: |-
        `token_hash` is deliberately absent — it never leaves the database.

        `is_active` is read-only: a badge is killed through `POST /visitors/{id}/revoke`
        so the action lands in the audit log as a revocation, not as a field edit.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - badge_serial
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - updated_at
    VisitorDetail:
      type: object
      description: '`GET /visitors/{id}` — the registration plus every scan it produced.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        scan_events:
          type: array
          items:
            $ref: '#/components/schemas/ScanEvent'
          readOnly: true
      required:
      - badge_serial
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - scan_events
      - updated_at
    VisitorIssued:
      type: object
      description: |-
        The response to `POST /visitors` — the one and only sight of the raw token.

        `badge_token` is what goes into the QR. It is not stored anywhere and cannot
        be recovered: the caller must print the card now (CLAUDE.md constraint #3).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        badge_token:
          type: string
          readOnly: true
          description: Raw badge token for the QR code. Shown once, never again.
      required:
      - badge_serial
      - badge_token
      - country
      - created_at
      - full_name
      - id
      - is_active
      - photo
      - updated_at
    VisitorIssuedRequest:
      type: object
      description: |-
        The response to `POST /visitors` — the one and only sight of the raw token.

        `badge_token` is what goes into the QR. It is not stored anywhere and cannot
        be recovered: the caller must print the card now (CLAUDE.md constraint #3).
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          minLength: 1
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: binary
        category:
          $ref: '#/components/schemas/CategoryEnum'
      required:
      - country
      - full_name
      - photo
  securitySchemes:
    deviceAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Permanent token from `POST /api/v1/devices/pair`, sent as `Authorization:
        Device <token>`.'
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
