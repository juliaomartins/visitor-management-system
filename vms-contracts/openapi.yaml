openapi: 3.0.3
info:
  title: VMS API
  version: 0.1.0
  description: Visitor Management System — event badge scanning on a closed LAN.
paths: {}
components:
  schemas:
    CategoryEnum:
      enum:
      - normal
      - vip
      type: string
      description: |-
        * `normal` - Normal
        * `vip` - VIP
    Device:
      type: object
      description: '`token_hash` is deliberately absent — the raw token is shown once,
        at pairing.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        is_active:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - last_seen_at
      - name
      - updated_at
    KindEnum:
      enum:
      - scanner
      - screen
      type: string
      description: |-
        * `scanner` - Scanner
        * `screen` - Screen
    PairingCode:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/KindEnum'
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - created_at
      - expires_at
      - id
      - kind
      - updated_at
      - used_at
    ResultEnum:
      enum:
      - valid
      - invalid
      - revoked
      - duplicate
      type: string
      description: |-
        * `valid` - Valid
        * `invalid` - Invalid
        * `revoked` - Revoked
        * `duplicate` - Duplicate
    ScanEvent:
      type: object
      description: The audit view of a scan — every row, including the failures.
      properties:
        id:
          type: integer
          readOnly: true
        visitor:
          type: string
          format: uuid
          nullable: true
        device:
          type: string
          format: uuid
        scanned_at:
          type: string
          format: date-time
        result:
          $ref: '#/components/schemas/ResultEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - device
      - id
      - result
      - scanned_at
      - updated_at
    ScreenEvent:
      type: object
      description: |-
        What the lobby screen renders, and nothing more.

        Sent over the WebSocket and returned by the backfill endpoint, so both paths
        produce identical objects and the screen can dedupe on `id`.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          readOnly: true
        country:
          type: string
          readOnly: true
        photo_url:
          type: string
          format: uri
          readOnly: true
        category:
          type: string
          readOnly: true
        scanned_at:
          type: string
          format: date-time
      required:
      - category
      - country
      - full_name
      - id
      - photo_url
      - scanned_at
    User:
      type: object
      description: Admin account, as the dashboard sees it. Never exposes the password
        hash.
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        is_staff:
          type: boolean
          title: Staff status
          description: Designates whether the user can log into this admin site.
        is_superuser:
          type: boolean
          title: Superuser status
          description: Designates that this user has all permissions without explicitly
            assigning them.
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        date_joined:
          type: string
          format: date-time
          readOnly: true
        last_login:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - date_joined
      - id
      - last_login
      - username
    Visitor:
      type: object
      description: '`token_hash` is deliberately absent — it never leaves the database.'
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        full_name:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 100
        organization:
          type: string
          maxLength: 200
        photo:
          type: string
          format: uri
        category:
          $ref: '#/components/schemas/CategoryEnum'
        badge_serial:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - badge_serial
      - country
      - created_at
      - full_name
      - id
      - photo
      - updated_at
